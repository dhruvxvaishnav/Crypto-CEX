# Aether — Market-data worker (Fly.io)
# Background worker; subscribes to Binance WebSocket and feeds the engine.
# Required secrets: DATABASE_URL, ENGINE_HOST, ENGINE_PORT, OTLP_ENDPOINT (optional)
#
# Deploy: fly deploy --config infra/fly/market-data/fly.toml

app            = "aether-market-data"
primary_region = "sin"
kill_signal    = "SIGTERM"
kill_timeout   = "5s"

[build]
  dockerfile = "services/market-data/Dockerfile"
  context    = "../../.."

[env]
  ENGINE_HOST = "aether-engine.internal"
  ENGINE_PORT = "7878"

# No [http_service] — this is a headless background worker.

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
